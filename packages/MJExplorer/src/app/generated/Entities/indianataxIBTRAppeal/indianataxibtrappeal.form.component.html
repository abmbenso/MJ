<mj-record-form-container [Record]="record" [FormComponent]="this"
    (Navigate)="OnFormNavigate($event)"
    (DeleteRequested)="OnDeleteRequested()"
    (FavoriteToggled)="OnFavoriteToggled()"
    (HistoryRequested)="OnHistoryRequested()"
    (ListManagementRequested)="OnListManagementRequested()">

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="before-fields" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>

    <!-- ========================================

    <!-- Appeal Docket Information Section -->
    <mj-collapsible-panel
        SectionKey="appealDocketInformation"
        SectionName="Appeal Docket Information"
        Icon="fa fa-info-circle"
        [Form]="this"
        [FormContext]="formContext">
        <mj-form-field 
            [Record]="record"
            [ShowLabel]="true"
            FieldName="POPLARAppealID"
            Type="number"
            [EditMode]="EditMode"
            [FormContext]="formContext"
        ></mj-form-field>
        <mj-form-field 
            [Record]="record"
            [ShowLabel]="true"
            FieldName="PetitionNumber"
            Type="code"
            [EditMode]="EditMode"
            [FormContext]="formContext"
        ></mj-form-field>

    </mj-collapsible-panel>

    <!-- Petitioner Information Section -->
    <mj-collapsible-panel
        SectionKey="petitionerInformation"
        SectionName="Petitioner Information"
        Icon="fa fa-info-circle"
        [Form]="this"
        [FormContext]="formContext">
        <mj-form-field 
            [Record]="record"
            [ShowLabel]="false"
            FieldName="PetitionerName"
            Type="textbox"
            [EditMode]="EditMode"
            [FormContext]="formContext"
        ></mj-form-field>

    </mj-collapsible-panel>

        <mj-form-field

            [EditMode]="EditMode"
            [FormContext]="formContext"

    <!-- Property Classification Section -->

        SectionKey="propertyClassification"

    <!-- ========================================
         RELATED ENTITY PANELS
         ======================================== -->

    <!-- IBTR Decision Citations Section -->
    <mj-collapsible-panel
        SectionKey="iBTRDecisionCitations"
        SectionName="IBTR Decision Citations"
        Icon="fa fa-balance-scale"
        Variant="related-entity"
        [Form]="this"
        [FormContext]="formContext"
        [BadgeCount]="GetSectionRowCount('iBTRDecisionCitations')"
        [DefaultExpanded]="false">
        @if (record.IsSaved) {
        <div>
            <mj-explorer-entity-data-grid
                [Params]="BuildRelationshipViewParamsByEntityName('IBTR Decision Citations','IBTRAppealID')"
                [NewRecordValues]="NewRecordValues('IBTR Decision Citations')"
                [AllowLoad]="IsSectionExpanded('iBTRDecisionCitations')"
                [ShowToolbar]="false"
                (Navigate)="OnFormNavigate($event)"
                (AfterDataLoad)="SetSectionRowCount('iBTRDecisionCitations', $event.totalRowCount)"
                >
            </mj-explorer-entity-data-grid>
        </div>
        }
    </mj-collapsible-panel>
